[graph]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
ignore = [
    { id = "RUSTSEC-2026-0253", reason = "aws-sdk-s3 1.143.0 pins lru 0.16; the affected cache is exclusive to S3 Express, while r2kit targets R2 and its cache key is a String with non-panicking Drop" },
]

[bans]
# The generated AWS SDK currently spans transitional HTTP and crypto versions.
# Direct dependency duplication is audited separately with cargo-machete/tree.
multiple-versions = "allow"
wildcards = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
