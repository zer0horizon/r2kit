[package]
name = "r2kit-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
serde_json = "1"
r2kit = { path = "..", features = ["serde"] }

[[bin]]
name = "protocol_boundaries"
path = "fuzz_targets/protocol_boundaries.rs"
test = false
doc = false
bench = false
